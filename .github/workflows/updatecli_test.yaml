---
name: Updatecli Test
on:
  pull_request:
permissions:
  contents: read
jobs:
  updatecli:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: "Checkout"
        uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
        with:
          persist-credentials: false
      - name: "Setup updatecli"
        uses: "updatecli/updatecli-action@ca8c01bf875e2520512c344a71dd02f3dc3326a7" # v3.7.0
      - name: "Setup zizmor"
        env:
          ZIZMOR_VERSION: "1.30.1"
          # Used by "gh attestation verify" to fetch zizmor build provenance.
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location \
            --output zizmor.tar.gz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          gh attestation verify zizmor.tar.gz --repo zizmorcore/zizmor
          tar --extract --gzip --file zizmor.tar.gz --directory "${RUNNER_TEMP}" zizmor
          rm zizmor.tar.gz
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/zizmor" --version
      - name: "Test updatecli in dry-run mode"
        run: "updatecli compose diff"
        env:
          # This step is executed in untrusted context. We use a GitHub token with minimal permissions.
          UPDATECLI_GITHUB_USERNAME: ${{ github.actor }}
          UPDATECLI_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ## The Github token is needed by Zizmor
          GITHUB_TOKEN: " ${{ secrets.GITHUB_TOKEN }}"
